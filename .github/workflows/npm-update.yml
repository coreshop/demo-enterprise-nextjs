name: npm update

# Weekly dependency update as a pull request.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm update --no-audit --no-fund
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/npm-update
          title: "Update package-lock.json"
          commit-message: "Update package-lock.json"
          body: "Scheduled `npm update` within the ranges of package.json."
          delete-branch: true
