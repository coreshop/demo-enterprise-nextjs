overwrite: true
# CODEGEN_SCHEMA_URL: GraphQL endpoint of a running CoreShop installation including the API key,
# e.g. https://coreshop-enterprise-demo.localhost/pimcore-graphql-webservices/coreshop?apikey=...
schema:
  - ${CODEGEN_SCHEMA_URL}
documents:
  - "./lib/graphql/**/*.graphql"
generates:
  lib/graphql/types.generated.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-document-nodes
