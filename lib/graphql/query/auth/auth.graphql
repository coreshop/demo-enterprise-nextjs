mutation CoreShopAuthorize($username: String!, $password: String!, $orderToken: String) {
    CoreShopAuthorize(authorize: {username: $username, password: $password, orderToken: $orderToken}) {
        ... on CoreShopAuthorizeResult {
            __typename
            token
            activeOrderToken
        }
        ... on CoreShopError {
            __typename
            message
        }
    }
}