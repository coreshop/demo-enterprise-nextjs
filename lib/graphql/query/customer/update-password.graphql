#import "../error.graphql"
#import "../validation-error.graphql"
mutation CoreShopUpdatePassword(
    $password: String
) {
    CoreShopUpdatePassword(updatePassword: {
        password: $password
    }) {
        __typename
        ... on CoreShopUpdatePasswordResult {
           __typename
        }
        ... on CoreShopError {
            ...error
        }
        ... on CoreShopValidationError {
            ...validation_error
        }
    }
}