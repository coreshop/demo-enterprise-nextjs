#import "order-fragment.graphql"
#import "../error.graphql"

mutation CoreShopAddToOrder($productId: Int!, $quantity: Float!, $token: String) {
    CoreShopAddToOrder(addToOrder: {order: {token: $token}, orderItem: {productId: $productId, quantity: $quantity}}) {
        ... on CoreShopAddToOrderResult {
            __typename
            order {
                ...order
            }
        }
        ... on CoreShopError {
            ...error
        }
    }
}