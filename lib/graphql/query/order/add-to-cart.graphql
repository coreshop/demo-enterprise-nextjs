#import "order-fragment.graphql"
#import "../error.graphql"

mutation CoreShopAddToOrder($productId: Int!, $quantity: Float!, $storeName: String!, $token: String) {
    CoreShopAddToOrder(addToOrder: {order: {token: $token}, orderItem: {productId: $productId, quantity: $quantity}, store: {storeName: $storeName}}) {
        ... on CoreShopAddToOrderResult {
            order {
                ...order
            }
        }
        ... on CoreShopError {
            ...error
        }
    }
}