#import "order-item-fragment.graphql"

fragment order on object_CoreShopOrder {
    id
    token
    totalGross
    totalNet
    subtotalGross
    subtotalNet
    currency {
        __typename
        isoCode
    }
    items {
        ...orderItem
    }
    taxes {
        ... on fieldcollection_CoreShopTaxItem {
            name
            rate
            amount
        }
    }
    priceRuleItems {
        ... on fieldcollection_CoreShopProposalCartPriceRuleItem {
            cartPriceRule {
                ... on CoreshopCartPriceRule {
                    name
                    isVoucherRule
                }
            }
            voucherCode
            discountNet
            discountGross
        }
    }
    adjustmentItems {
        ... on fieldcollection_CoreShopAdjustment {
            typeIdentifier
            label
            pimcoreAmountNet
            pimcoreAmountGross
        }
    }
}
