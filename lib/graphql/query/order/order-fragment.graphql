#import "order-item-fragment.graphql"
#import "../customer/customer-fragment.graphql"
#import "../address/address-fragment.graphql"

fragment order on object_CoreShopOrder {
    id
    token
    totalGross
    totalNet
    subtotalGross
    subtotalNet
    carrier {
        __typename
        identifier
    }
    currency {
        __typename
        isoCode
    }
    paymentProvider {
        __typename
        identifier
    }
    items {
        ...orderItem
    }
    customer {
        ...customer
    }
    taxes {
        ... on fieldcollection_CoreShopTaxItem {
            name
            rate
            amount
        }
    }
    priceRuleItems {
        ... on fieldcollection_CoreShopProposalCartPriceRuleItem {
            cartPriceRule {
                ... on CoreshopCartPriceRule {
                    name
                    isVoucherRule
                }
            }
            voucherCode
            discountNet
            discountGross
        }
    }
    adjustmentItems {
        ... on fieldcollection_CoreShopAdjustment {
            typeIdentifier
            label
            pimcoreAmountNet
            pimcoreAmountGross
        }
    }
    shippingAddress {
        ...address
    }
    invoiceAddress {
        ...address
    }
}
